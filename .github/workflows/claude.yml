name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, '@claude-review')
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        !contains(github.event.comment.body, '@claude-review')
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        !contains(github.event.review.body, '@claude-review')
      ) ||
      (
        github.event_name == 'issues' &&
        (
          (contains(github.event.issue.body, '@claude') && !contains(github.event.issue.body, '@claude-review')) ||
          (contains(github.event.issue.title, '@claude') && !contains(github.event.issue.title, '@claude-review'))
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # allow read/write/move file operations via GITHUB_TOKEN
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Fetch all remote branches
        run: git fetch --all --tags

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: >-
            --allowed-tools Bash(gh pr:*)
            ,Bash(gh issue:*)
            ,Bash(git status:*)
            ,Bash(git fetch:*)
            ,Bash(git checkout:*)
            ,Bash(git branch:*)
            ,Bash(git add:*)
            ,Bash(git commit:*)
            ,Bash(git push:*)
            ,Bash(git diff:*)
            ,Bash(git apply:*)
            ,Bash(git mv:*)
            ,Bash(git reset:*)
            ,Bash(git merge:*)
            ,Bash(mv:*)
            ,Bash(cp:*)
            ,Bash(rm:*)
            ,Bash(find:*)
            ,Bash(ls:*)
            ,Bash(cat:*)
            ,Bash(touch:*)
            ,Bash(echo:*)
            ,Bash(sed:*)
            ,Bash(perl:*)
            ,Bash(node:*)
            ,Bash(npm:*)
            ,Bash(yarn:*)